<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark luxury obsidian gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="50%" stop-color="#090D15"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CA"/>
      <stop offset="40%" stop-color="#DFC193"/>
      <stop offset="75%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9C7F53"/>
    </linearGradient>

    <!-- Cable Metallic Gradient -->
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFC193"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#DFC193"/>
    </linearGradient>

    <!-- Subtle inner shadow / border glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#C5A880" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.85"/>

  <!-- High-Tension Structural Safety Cables (Vertical Precision Lines) -->
  <g stroke="url(#cableGrad)" stroke-width="2.2" stroke-linecap="round">
    <!-- Left Cable -->
    <line x1="26" y1="18" x2="26" y2="46"/>
    <!-- Center Cable -->
    <line x1="33" y1="16" x2="33" y2="48"/>
    <!-- Right Cable -->
    <line x1="40" y1="18" x2="40" y2="46"/>
  </g>

  <!-- Precision Anchor Studs (Fasteners) -->
  <g fill="url(#goldGrad)">
    <circle cx="26" cy="18" r="2"/>
    <circle cx="26" cy="46" r="2"/>
    <circle cx="33" cy="16" r="2.2"/>
    <circle cx="33" cy="48" r="2.2"/>
    <circle cx="40" cy="18" r="2"/>
    <circle cx="40" cy="46" r="2"/>
  </g>

  <!-- CLEARVIEW "C" Monogram Architectural Guard / Shield Frame -->
  <path
    d="M 45 19
       C 40 14, 28 14, 21 21
       C 14 28, 14 36, 21 43
       C 28 50, 40 50, 45 45"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- Subtle Central Glint / Diamond Apex (Engineering Safety Certified) -->
  <circle cx="17.5" cy="32" r="1.8" fill="#FFFFFF"/>
</svg>
